
<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1"
/>

<title>PDF Research Assistant</title>

<style>

:root{
--bg:#07111f;
--panel:#0f1b2d;
--card:#14233b;
--primary:#3b82f6;
--border:#223552;
--text:#ffffff;
--muted:#9bb4d6;
}

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:Arial;
background:linear-gradient(
135deg,
#07111f,
#0f172a
);
color:white;
height:100vh;
overflow:hidden;
}

.container{
display:grid;
grid-template-columns:360px 1fr;
height:100vh;
}

/* ========================================= */
/* LEFT PANEL */
/* ========================================= */

.left{
background:var(--panel);
padding:24px;
border-right:1px solid var(--border);
overflow-y:auto;
}

.logo{
font-size:34px;
font-weight:700;
margin-bottom:30px;
}

.card{
background:var(--card);
padding:22px;
border-radius:18px;
margin-bottom:22px;
}

input{
width:100%;
padding:14px;
background:#08111d;
color:white;
border:none;
border-radius:14px;
outline:none;
}

button{
width:100%;
padding:14px;
margin-top:14px;
border:none;
border-radius:14px;
background:var(--primary);
color:white;
font-weight:700;
cursor:pointer;
}

button:hover{
opacity:0.9;
}

#status{
margin-top:20px;
white-space:pre-line;
color:#9cc9ff;
}

/* ========================================= */
/* RIGHT PANEL */
/* ========================================= */

.right{
display:flex;
flex-direction:column;
height:100vh;
}

.header{
padding:24px;
font-size:22px;
font-weight:700;
border-bottom:1px solid var(--border);
}

.chat{
flex:1;
overflow-y:auto;
padding:20px;
display:flex;
flex-direction:column;
gap:12px;
}

.msg{
padding:14px;
border-radius:14px;
max-width:85%;
white-space:pre-wrap;
line-height:1.5;
}

.user{
align-self:flex-end;
background:var(--primary);
}

.bot{
align-self:flex-start;
background:var(--card);
}

.chatbox{
padding:16px;
border-top:1px solid var(--border);
}

.row{
display:flex;
gap:10px;
}

textarea{
flex:1;
min-height:60px;
padding:14px;
background:#08111d;
border:none;
border-radius:14px;
color:white;
resize:none;
outline:none;
}

.send{
width:120px;
}

/* ========================================= */
/* MOBILE */
/* ========================================= */

@media(max-width:900px){

.container{
grid-template-columns:1fr;
}

.left{
display:none;
}

}

</style>

</head>

<body>

<div class="container">

<!-- ====================================== -->
<!-- LEFT PANEL -->
<!-- ====================================== -->

<div class="left">

<div class="logo">
📄 PDF Chat
</div>

<div class="card">

<h3>Upload PDF</h3>

<input
type="file"
id="file"
accept=".pdf"
/>

<button onclick="uploadFile()">
Upload PDF
</button>

</div>

<div id="status">
Upload a PDF to begin.
</div>

</div>

<!-- ====================================== -->
<!-- RIGHT PANEL -->
<!-- ====================================== -->

<div class="right">

<div class="header">
Research Assistant
</div>

<div id="chat" class="chat">

<div class="msg bot">
Upload a PDF to start chatting.
</div>

</div>

<div class="chatbox">

<div class="row">

<textarea
id="q"
placeholder="Ask something..."
disabled
></textarea>

<button
onclick="ask()"
class="send">
Send
</button>

</div>

</div>

</div>

</div>

<script>

const chat =
document.getElementById("chat");

const input =
document.getElementById("q");

const status =
document.getElementById("status");

/* ===================================== */
/* ADD MESSAGE */
/* ===================================== */

function add(text,type){

let div =
document.createElement("div");

div.className =
"msg " + type;

div.innerText = text;

chat.appendChild(div);

chat.scrollTop =
chat.scrollHeight;

return div;
}

/* ===================================== */
/* ENABLE CHAT */
/* ===================================== */

function enable(){

input.disabled = false;
}

/* ===================================== */
/* UPLOAD PDF */
/* ===================================== */

async function uploadFile(){

let file =
document.getElementById("file")
.files[0];

if(!file){

alert("Please select a PDF");

return;
}

status.innerText =
"Processing PDF...";

let fd = new FormData();

fd.append("file", file);

try{

let response =
await fetch("/upload",{

method:"POST",
body:fd

});

let data =
await response.json();

if(data.error){

status.innerText =
data.error;

return;
}

status.innerText =
`✅ PDF Ready

Chunks: ${data.chunks}

Embedding Time:
${data.embed_time}s`;

enable();

add(
"✅ PDF uploaded successfully.",
"bot"
);

}
catch(err){

status.innerText =
"Upload failed.";

console.log(err);

}

}

/* ===================================== */
/* ASK QUESTION */
/* ===================================== */

async function ask(){

let q = input.value.trim();

if(!q) return;

add(q,"user");

input.value = "";

let bot =
add("Thinking...","bot");

try{

let response =
await fetch("/ask",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({
question:q
})

});

let data =
await response.json();

bot.innerText =
data.answer;

}
catch(err){

bot.innerText =
"Error contacting server.";

console.log(err);

}

}

/* ===================================== */
/* ENTER KEY */
/* ===================================== */

input.addEventListener(
"keydown",
function(e){

if(
e.key === "Enter" &&
!e.shiftKey
){

e.preventDefault();

ask();

}

}
);

</script>

</body>
</html>
