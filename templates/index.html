
<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
/>

<title>PDF Research Assistant</title>

<style>

:root{
--bg:#07111f;
--panel:#0f1b2d;
--card:#14233b;
--primary:#3b82f6;
--border:#223552;
--text:#ffffff;
--muted:#9bb4d6;
}

*{
margin:0;
padding:0;
box-sizing:border-box;
}

html,
body{
width:100%;
height:100%;
overflow:hidden;
font-family:Arial,sans-serif;
background:linear-gradient(
135deg,
#07111f,
#0f172a
);
color:white;
}

/* ========================================= */
/* MAIN CONTAINER */
/* ========================================= */

.container{
display:grid;
grid-template-columns:360px 1fr;
height:100dvh;
width:100%;
overflow:hidden;
}

/* ========================================= */
/* LEFT PANEL */
/* ========================================= */

.left{
background:var(--panel);
padding:24px;
border-right:1px solid var(--border);
overflow-y:auto;
}

.logo{
font-size:34px;
font-weight:700;
margin-bottom:30px;
}

.card{
background:var(--card);
padding:22px;
border-radius:18px;
margin-bottom:22px;
}

.card h3{
margin-bottom:16px;
}

/* INPUT */

input{
width:100%;
padding:14px;
background:#08111d;
color:white;
border:none;
border-radius:14px;
outline:none;
font-size:16px;
}

/* BUTTON */

button{
width:100%;
padding:14px;
margin-top:14px;
border:none;
border-radius:14px;
background:var(--primary);
color:white;
font-weight:700;
cursor:pointer;
font-size:16px;
transition:0.2s;
}

button:hover{
opacity:0.9;
}

/* STATUS */

#status{
margin-top:20px;
white-space:pre-line;
color:#9cc9ff;
line-height:1.6;
}

/* ========================================= */
/* RIGHT PANEL */
/* ========================================= */

.right{
display:flex;
flex-direction:column;
height:100dvh;
overflow:hidden;
position:relative;
}

/* HEADER */

.header{
padding:20px;
font-size:22px;
font-weight:700;
border-bottom:1px solid var(--border);
background:#0b1627;
z-index:10;
}

/* CHAT AREA */

.chat{
flex:1;
overflow-y:auto;
padding:20px;
padding-bottom:120px;
display:flex;
flex-direction:column;
gap:12px;
scroll-behavior:smooth;
}

/* MESSAGE */

.msg{
padding:14px 16px;
border-radius:16px;
max-width:85%;
white-space:pre-wrap;
line-height:1.6;
word-wrap:break-word;
font-size:15px;
animation:fadeIn 0.2s ease;
}

.user{
align-self:flex-end;
background:var(--primary);
}

.bot{
align-self:flex-start;
background:var(--card);
}

/* CHAT INPUT */

.chatbox{
position:sticky;
bottom:0;
width:100%;
padding:14px;
border-top:1px solid var(--border);
background:#0b1627;
backdrop-filter:blur(10px);
z-index:20;
padding-bottom:
max(14px, env(safe-area-inset-bottom));
}

.row{
display:flex;
gap:10px;
align-items:flex-end;
}

/* TEXTAREA */

textarea{
flex:1;
min-height:54px;
max-height:160px;
padding:14px;
background:#08111d;
border:none;
border-radius:14px;
color:white;
resize:none;
outline:none;
font-size:16px;
overflow-y:auto;
}

/* SEND BUTTON */

.send{
width:110px;
min-width:110px;
margin-top:0;
height:54px;
}

/* ========================================= */
/* MOBILE */
/* ========================================= */

@media(max-width:900px){

.container{
grid-template-columns:1fr;
}

.left{
display:none;
}

.header{
font-size:20px;
padding:16px;
text-align:center;
}

.chat{
padding:14px;
padding-bottom:110px;
}

.msg{
max-width:92%;
font-size:14px;
}

}

@media(max-width:600px){

.container{
height:100dvh;
}

.right{
height:100dvh;
}

.header{
font-size:18px;
padding:14px;
}

.chat{
padding:12px;
padding-bottom:120px;
}

.msg{
padding:12px;
font-size:14px;
max-width:95%;
}

.chatbox{
padding:10px;
padding-bottom:
max(10px, env(safe-area-inset-bottom));
}

.row{
gap:8px;
}

textarea{
min-height:50px;
font-size:16px;
padding:12px;
}

.send{
width:90px;
min-width:90px;
height:50px;
font-size:14px;
}

button{
font-size:15px;
}

}

@media(max-width:400px){

.send{
width:80px;
min-width:80px;
font-size:13px;
}

textarea{
font-size:15px;
}

.logo{
font-size:26px;
}

}

/* ========================================= */
/* ANIMATION */
/* ========================================= */

@keyframes fadeIn{

from{
opacity:0;
transform:translateY(8px);
}

to{
opacity:1;
transform:translateY(0);
}

}

/* ========================================= */
/* SCROLLBAR */
/* ========================================= */

::-webkit-scrollbar{
width:6px;
height:6px;
}

::-webkit-scrollbar-thumb{
background:#2a4365;
border-radius:10px;
}

::-webkit-scrollbar-track{
background:transparent;
}

</style>

</head>

<body>

<div class="container">

<!-- ====================================== -->
<!-- LEFT PANEL -->
<!-- ====================================== -->

<div class="left">

<div class="logo">
📄 PDF Chat
</div>

<div class="card">

<h3>Upload PDF</h3>

<input
type="file"
id="file"
accept=".pdf"
/>

<button onclick="uploadFile()">
Upload PDF
</button>

</div>

<div id="status">
Upload a PDF to begin.
</div>

</div>

<!-- ====================================== -->
<!-- RIGHT PANEL -->
<!-- ====================================== -->

<div class="right">

<div class="header">
Research Assistant
</div>

<div id="chat" class="chat">

<div class="msg bot">
Upload a PDF to start chatting.
</div>

</div>

<!-- CHAT INPUT -->

<div class="chatbox">

<div class="row">

<textarea
id="q"
placeholder="Ask something..."
disabled
></textarea>

<button
onclick="ask()"
class="send">
Send
</button>

</div>

</div>

</div>

</div>

<script>

const chat =
document.getElementById("chat");

const input =
document.getElementById("q");

const status =
document.getElementById("status");

/* ===================================== */
/* ADD MESSAGE */
/* ===================================== */

function add(text,type){

let div =
document.createElement("div");

div.className =
"msg " + type;

div.innerText = text;

chat.appendChild(div);

chat.scrollTop =
chat.scrollHeight;

return div;
}

/* ===================================== */
/* ENABLE CHAT */
/* ===================================== */

function enable(){

input.disabled = false;

input.focus();

}

/* ===================================== */
/* AUTO RESIZE TEXTAREA */
/* ===================================== */

input.addEventListener(
"input",
function(){

this.style.height = "auto";

this.style.height =
(this.scrollHeight) + "px";

}
);

/* ===================================== */
/* UPLOAD PDF */
/* ===================================== */

async function uploadFile(){

let file =
document.getElementById("file")
.files[0];

if(!file){

alert("Please select a PDF");

return;
}

status.innerText =
"Processing PDF...";

let fd = new FormData();

fd.append("file", file);

try{

let response =
await fetch("/upload",{

method:"POST",
body:fd

});

let data =
await response.json();

if(data.error){

status.innerText =
data.error;

return;
}

status.innerText =
`✅ PDF Ready

Chunks: ${data.chunks}

Embedding Time:
${data.embed_time}s`;

enable();

add(
"✅ PDF uploaded successfully.",
"bot"
);

}
catch(err){

status.innerText =
"Upload failed.";

console.log(err);

}

}

/* ===================================== */
/* ASK QUESTION */
/* ===================================== */

async function ask(){

let q = input.value.trim();

if(!q) return;

add(q,"user");

input.value = "";

input.style.height = "54px";

let bot =
add("Thinking...","bot");

try{

let response =
await fetch("/ask",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({
question:q
})

});

let data =
await response.json();

bot.innerText =
data.answer;

chat.scrollTop =
chat.scrollHeight;

}
catch(err){

bot.innerText =
"Error contacting server.";

console.log(err);

}

}

/* ===================================== */
/* ENTER KEY */
/* ===================================== */

input.addEventListener(
"keydown",
function(e){

if(
e.key === "Enter" &&
!e.shiftKey
){

e.preventDefault();

ask();

}

}
);

/* ===================================== */
/* MOBILE VIEWPORT FIX */
/* ===================================== */

window.addEventListener(
"resize",
function(){

chat.scrollTop =
chat.scrollHeight;

}
);

</script>

</body>

</html>
