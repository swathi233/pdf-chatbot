<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Research Assistant</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz@14..32&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #0b1120;
            color: #f0f4ff;
            height: 100vh;
            overflow: hidden;
        }

        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: #0f1a2b; }
        ::-webkit-scrollbar-thumb { background: #2d4b7a; border-radius: 8px; }

        .app {
            display: grid;
            grid-template-columns: 380px 1fr;
            height: 100vh;
            gap: 0;
            background: #0b1120;
        }

        .left-panel {
            background: #111d2f;
            border-right: 1px solid #1e314a;
            padding: 28px 20px;
            overflow-y: auto;
            backdrop-filter: blur(4px);
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .logo {
            font-size: 32px;
            font-weight: 700;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #8ab4ff, #3b82f6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .logo i {
            -webkit-text-fill-color: initial;
            color: #8ab4ff;
            font-size: 28px;
        }

        .card {
            background: #15273f;
            border-radius: 24px;
            padding: 22px 20px;
            border: 1px solid #1e3452;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
            transition: 0.25s ease;
        }
        .card:hover {
            border-color: #2f4b72;
        }

        .card h3 {
            font-weight: 600;
            font-size: 16px;
            letter-spacing: 0.3px;
            color: #b8cef0;
            margin-bottom: 18px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .user-info {
            display: none;
            background: #1a2f4a;
            border-radius: 40px;
            padding: 10px 16px 10px 20px;
            margin-top: 10px;
            align-items: center;
            justify-content: space-between;
            border: 1px solid #2a4b7a;
        }
        .user-info.show {
            display: flex;
        }
        .user-info .user-email {
            font-weight: 500;
            font-size: 14px;
            color: #cadeff;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .user-info .logout-icon {
            background: #2d3f5a;
            border: none;
            padding: 8px 16px;
            border-radius: 40px;
            color: #f0f4ff;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            transition: 0.2s;
        }
        .user-info .logout-icon:hover {
            background: #b91c1c;
        }

        #status {
            font-size: 14px;
            color: #a0bee3;
            line-height: 1.6;
            padding: 6px 4px;
            min-height: 48px;
        }

        .file-upload-area {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .file-upload-area input[type="file"] {
            background: #0b1627;
            border: 1px dashed #2f4b72;
            border-radius: 40px;
            padding: 12px 16px;
            color: #b8cef0;
            font-size: 13px;
            cursor: pointer;
        }
        .file-upload-area input[type="file"]:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .right-panel {
            display: flex;
            flex-direction: column;
            background: #0d1524;
            height: 100vh;
        }

        .chat-header {
            padding: 18px 28px;
            background: #111d2f;
            border-bottom: 1px solid #1e314a;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .chat-header h2 {
            font-weight: 600;
            font-size: 20px;
            color: #e8f0fe;
            letter-spacing: -0.2px;
        }
        .chat-header .badge {
            background: #1a2f4a;
            padding: 6px 16px;
            border-radius: 40px;
            font-size: 13px;
            font-weight: 500;
            color: #b8cef0;
            border: 1px solid #2a4b7a;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 24px 28px 16px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .msg {
            padding: 14px 20px;
            border-radius: 20px;
            max-width: 80%;
            line-height: 1.7;
            font-size: 15px;
            word-wrap: break-word;
            white-space: pre-wrap;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
            animation: slideIn 0.3s ease;
        }
        
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .msg.user {
            align-self: flex-end;
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: white;
            border-bottom-right-radius: 6px;
        }
        .msg.bot {
            align-self: flex-start;
            background: #182b42;
            color: #e8f0fe;
            border-bottom-left-radius: 6px;
            border: 1px solid #243b58;
        }
        
        .msg.greeting {
            align-self: flex-start;
            background: linear-gradient(135deg, #1a3a5a, #0d2640);
            color: #e8f0fe;
            border: 1px solid #2a4b7a;
            border-bottom-left-radius: 6px;
            font-size: 16px;
            padding: 16px 24px;
        }
        
        .msg.greeting .greeting-icon {
            font-size: 24px;
            margin-right: 10px;
        }
        
        .msg.greeting .greeting-text {
            display: inline;
        }
        
        .msg.casual-greeting {
            align-self: flex-start;
            background: linear-gradient(135deg, #1a4a3a, #0d2a20);
            color: #e8f0fe;
            border: 1px solid #2a6a4a;
            border-bottom-left-radius: 6px;
            font-size: 16px;
            padding: 14px 22px;
        }

        .chat-input-area {
            padding: 16px 28px 24px;
            background: #0d1524;
            border-top: 1px solid #1e314a;
        }
        .input-row {
            display: flex;
            gap: 12px;
            align-items: flex-end;
        }
        .input-row textarea {
            flex: 1;
            background: #0f1a2b;
            border: 1px solid #1e3452;
            border-radius: 40px;
            padding: 14px 20px;
            color: white;
            font-size: 15px;
            resize: none;
            outline: none;
            min-height: 56px;
            max-height: 140px;
            line-height: 1.5;
            transition: 0.2s;
        }
        .input-row textarea:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px #3b82f622;
        }
        .input-row textarea:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .send-btn {
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            border: none;
            padding: 14px 28px;
            border-radius: 40px;
            font-weight: 700;
            font-size: 15px;
            color: white;
            cursor: pointer;
            min-width: 100px;
            transition: 0.2s;
            box-shadow: 0 4px 12px #1e4b8a55;
            height: 56px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .send-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px #1e4b8a88;
        }
        .send-btn:disabled {
            opacity: 0.4;
            transform: none;
            cursor: not-allowed;
        }

        .login-prompt {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            padding: 20px 0;
        }

        .login-prompt .btn-primary {
            width: auto;
            padding: 14px 40px;
            margin-top: 0;
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            border: none;
            border-radius: 60px;
            font-weight: 700;
            font-size: 15px;
            color: white;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 6px 16px #1e4b8a55;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            text-decoration: none;
        }
        .login-prompt .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 28px #1e4b8a88;
        }

        .upload-status {
            margin-top: 10px;
            padding: 10px 16px;
            border-radius: 40px;
            font-size: 13px;
            background: #0f1a2b;
            border: 1px solid #1e3452;
            display: none;
        }
        .upload-status.show {
            display: block;
        }
        .upload-status.success {
            border-color: #2a6a4a;
            color: #4ade80;
        }
        .upload-status.error {
            border-color: #6a2a2a;
            color: #f87171;
        }

        @media (max-width: 820px) {
            .app {
                grid-template-columns: 1fr;
            }
            .left-panel {
                display: none;
            }
            .chat-messages {
                padding: 16px;
            }
            .chat-header {
                padding: 14px 18px;
            }
            .chat-input-area {
                padding: 12px 18px 18px;
            }
        }
    </style>
</head>
<body>
<div class="app">
    <!-- LEFT PANEL -->
    <div class="left-panel">
        <div class="logo"><i class="fas fa-file-pdf"></i> PDF Chat</div>

        <div class="card">
            <h3><i class="fas fa-user"></i> Account</h3>
            <div id="userInfo" class="user-info">
                <span class="user-email" id="userDisplay"></span>
                <button class="logout-icon" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Logout</button>
            </div>
            <div id="loginPrompt" class="login-prompt">
                <p style="color: #9bb4d6; font-size: 14px; text-align: center;">
                    <i class="fas fa-lock"></i> Please login to continue
                </p>
                <a href="/login-page" class="btn-primary">
                    <i class="fas fa-sign-in-alt"></i> Go to Login
                </a>
            </div>
        </div>

        <div class="card">
            <h3><i class="fas fa-upload"></i> Upload PDF</h3>
            <div class="file-upload-area">
                <input type="file" id="file" accept=".pdf" disabled/>
                <button class="btn-primary" onclick="uploadFile()" id="uploadBtn" disabled>
                    <i class="fas fa-cloud-upload-alt"></i> Upload & Process
                </button>
                <div id="uploadStatus" class="upload-status"></div>
            </div>
        </div>

        <div id="status"><i class="fas fa-info-circle"></i> 🔑 Login to get started.</div>
    </div>

    <!-- RIGHT PANEL -->
    <div class="right-panel">
        <div class="chat-header">
            <h2><i class="fas fa-robot"></i> Research Assistant</h2>
            <span class="badge" id="userBadge"><i class="fas fa-lock"></i> Not logged in</span>
        </div>

        <div class="chat-messages" id="chat">
            <div class="msg bot"><i class="fas fa-robot"></i> 👋 Login to upload and chat with your PDFs.</div>
        </div>

        <div class="chat-input-area">
            <div class="input-row">
                <textarea id="q" placeholder="Ask anything..." disabled></textarea>
                <button class="send-btn" id="sendBtn" disabled onclick="ask()"><i class="fas fa-paper-plane"></i> Send</button>
            </div>
        </div>
    </div>
</div>

<script>
// ==========================
// DOM REFS & STATE
// ==========================
const chat = document.getElementById("chat");
const input = document.getElementById("q");
const statusDiv = document.getElementById("status");
const uploadStatus = document.getElementById("uploadStatus");
let isAuthenticated = false;
let currentUser = "";
let hasShownGreeting = false;
let isProcessing = false;

// ==========================
// UI FUNCTIONS
// ==========================
function updateUIForAuth(authenticated, user) {
    const fileInput = document.getElementById("file");
    const uploadBtn = document.getElementById("uploadBtn");
    const sendBtn = document.getElementById("sendBtn");
    const userInfo = document.getElementById("userInfo");
    const loginPrompt = document.getElementById("loginPrompt");
    const userBadge = document.getElementById("userBadge");
    const userDisplay = document.getElementById("userDisplay");

    if (authenticated) {
        userInfo.classList.add("show");
        loginPrompt.style.display = "none";
        userDisplay.textContent = user;
        userBadge.innerHTML = `<i class="fas fa-check-circle" style="color:#4ade80;"></i> ${user.substring(0, 16)}${user.length > 16 ? '…' : ''}`;
        fileInput.disabled = false;
        uploadBtn.disabled = false;
        sendBtn.disabled = false;
        input.disabled = false;
        statusDiv.innerHTML = '<i class="fas fa-check-circle" style="color:#4ade80;"></i> Logged in. Upload a PDF to begin.';
        addBotMessage("✅ Logged in successfully!");
    } else {
        userInfo.classList.remove("show");
        loginPrompt.style.display = "flex";
        userBadge.innerHTML = '<i class="fas fa-lock"></i> Not logged in';
        fileInput.disabled = true;
        uploadBtn.disabled = true;
        sendBtn.disabled = true;
        input.disabled = true;
        statusDiv.innerHTML = '<i class="fas fa-info-circle"></i> 🔑 Please login to continue.';
    }
}

async function checkAuth() {
    try {
        const res = await fetch("/check_auth");
        const data = await res.json();
        if (data.authenticated) {
            isAuthenticated = true;
            currentUser = data.user;
            updateUIForAuth(true, data.user);
            // Check for any stored greeting
            checkForGreeting();
        } else {
            isAuthenticated = false;
            updateUIForAuth(false, "");
        }
    } catch (e) { console.log("Auth check error", e); }
}

async function checkForGreeting() {
    try {
        const res = await fetch("/get_greeting");
        const data = await res.json();
        if (data.greeting && !hasShownGreeting) {
            hasShownGreeting = true;
            addGreeting(data.greeting);
        }
    } catch (e) { console.log("Greeting check error", e); }
}

// ==========================
// AUTH ACTIONS
// ==========================
async function logout() {
    try {
        await fetch("/logout", { method: "POST" });
        isAuthenticated = false;
        currentUser = "";
        hasShownGreeting = false;
        updateUIForAuth(false, "");
        addBotMessage("🔒 Logged out.");
        chat.innerHTML = '<div class="msg bot"><i class="fas fa-robot"></i> 👋 Login to upload and chat with your PDFs.</div>';
    } catch (e) { console.log("Logout error", e); }
}

// ==========================
// CHAT FUNCTIONS
// ==========================
function add(text, type) {
    const div = document.createElement("div");
    div.className = "msg " + type;
    div.innerHTML = text;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
    return div;
}

function addBotMessage(text) { add(text, "bot"); }

function addGreeting(text) {
    const div = document.createElement("div");
    div.className = "msg greeting";
    div.innerHTML = `
        <span class="greeting-icon">🎉</span>
        <span class="greeting-text">${text}</span>
    `;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
    return div;
}

function addCasualGreeting(text) {
    const div = document.createElement("div");
    div.className = "msg casual-greeting";
    div.innerHTML = `👋 ${text}`;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
    return div;
}

function showUploadStatus(message, type) {
    uploadStatus.textContent = message;
    uploadStatus.className = 'upload-status show ' + type;
}

async function uploadFile() {
    if (!isAuthenticated) { 
        statusDiv.innerHTML = '<i class="fas fa-exclamation-circle"></i> ❌ Please login first'; 
        return; 
    }
    
    const fileInput = document.getElementById("file");
    const file = fileInput.files[0];
    if (!file) { 
        alert("Please select a PDF file"); 
        return; 
    }
    
    // Check if it's a PDF
    if (!file.name.toLowerCase().endsWith('.pdf')) {
        alert("Please select a valid PDF file");
        return;
    }
    
    const uploadBtn = document.getElementById("uploadBtn");
    uploadBtn.disabled = true;
    uploadBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Processing...';
    
    showUploadStatus('⏳ Uploading and processing your document...', '');
    statusDiv.innerHTML = '<i class="fas fa-spinner fa-spin"></i> ⏳ Processing PDF…';
    
    const fd = new FormData();
    fd.append("file", file);
    
    try {
        const res = await fetch("/upload", { method: "POST", body: fd });
        const data = await res.json();
        
        if (data.error) { 
            showUploadStatus('❌ ' + data.error, 'error');
            statusDiv.innerHTML = `<i class="fas fa-exclamation-circle"></i> ❌ ${data.error}`;
            uploadBtn.disabled = false;
            uploadBtn.innerHTML = '<i class="fas fa-cloud-upload-alt"></i> Upload & Process';
            return; 
        }
        
        // Success - show greeting
        showUploadStatus(`✅ Document ready! ${data.chunks} chunks processed.`, 'success');
        statusDiv.innerHTML = `<i class="fas fa-check-circle" style="color:#4ade80;"></i> ✅ PDF Ready · ${data.chunks} chunks`;
        
        // Add the greeting message to chat
        if (data.greeting) {
            addGreeting(data.greeting);
            hasShownGreeting = true;
        }
        
        // Add a follow-up message
        setTimeout(() => {
            addBotMessage("💡 You can now ask me any questions about the document!");
        }, 500);
        
        // Clear the file input
        fileInput.value = '';
        
    } catch (e) { 
        showUploadStatus('❌ Upload failed. Please try again.', 'error');
        statusDiv.innerHTML = '<i class="fas fa-exclamation-circle"></i> ❌ Upload failed'; 
    } finally {
        uploadBtn.disabled = false;
        uploadBtn.innerHTML = '<i class="fas fa-cloud-upload-alt"></i> Upload & Process';
    }
}

async function ask() {
    if (!isAuthenticated) { 
        addBotMessage("❌ Please login first"); 
        return; 
    }
    
    if (isProcessing) return;
    
    const q = input.value.trim();
    if (!q) return;
    
    // Show user message immediately
    add(`<i class="fas fa-user"></i> ${q}`, "user");
    input.value = "";
    input.style.height = "56px";
    
    // Show thinking indicator
    const bot = add('<i class="fas fa-spinner fa-spin"></i> Thinking…', "bot");
    isProcessing = true;
    
    try {
        const res = await fetch("/ask", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ question: q })
        });
        const data = await res.json();
        
        // Check if it's a casual greeting response
        if (data.type === "greeting") {
            // Replace the bot message with a styled casual greeting
            bot.className = "msg casual-greeting";
            bot.innerHTML = `👋 ${data.answer}`;
        } else {
            bot.innerHTML = `<i class="fas fa-robot"></i> ${data.answer || "No answer"}`;
        }
    } catch (e) { 
        bot.innerHTML = '<i class="fas fa-exclamation-circle"></i> Error contacting server.'; 
    } finally {
        isProcessing = false;
    }
}

// ==========================
// EVENT LISTENERS
// ==========================
input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) { 
        e.preventDefault(); 
        if (!isProcessing) ask(); 
    }
});

input.addEventListener("input", function() {
    this.style.height = "auto";
    this.style.height = Math.min(this.scrollHeight, 140) + "px";
});

// File input change handler - show filename
document.getElementById("file").addEventListener("change", function() {
    if (this.files.length > 0) {
        const fileName = this.files[0].name;
        showUploadStatus(`📄 Selected: ${fileName}`, '');
    } else {
        uploadStatus.className = 'upload-status';
    }
});

// ==========================
// INITIALIZE
// ==========================
checkAuth();

console.log("✅ App initialized with enhanced greeting support");
</script>
</body>
</html>
