```html
<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>PDF Research Assistant</title>

<style>

:root{
--bg:#07111f;
--panel:#0f1b2d;
--card:#14233b;
--primary:#3b82f6;
--border:#223552;
--text:#ffffff;
}

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:Arial;
background:linear-gradient(135deg,#07111f,#0f172a);
color:white;
height:100vh;
overflow:hidden;
}

.container{
display:grid;
grid-template-columns:350px 1fr;
height:100vh;
}

.left{
background:var(--panel);
padding:24px;
border-right:1px solid var(--border);
}

.logo{
font-size:32px;
font-weight:700;
margin-bottom:30px;
}

.card{
background:var(--card);
padding:20px;
border-radius:18px;
}

input{
width:100%;
padding:14px;
margin-top:12px;
border:none;
border-radius:12px;
background:#08111d;
color:white;
}

button{
width:100%;
padding:14px;
margin-top:14px;
border:none;
border-radius:12px;
background:var(--primary);
color:white;
font-weight:700;
cursor:pointer;
}

#status{
margin-top:20px;
white-space:pre-line;
color:#9cc9ff;
}

.right{
display:flex;
flex-direction:column;
height:100vh;
}

.header{
padding:20px;
font-size:22px;
font-weight:700;
border-bottom:1px solid var(--border);
}

.chat{
flex:1;
overflow-y:auto;
padding:20px;
display:flex;
flex-direction:column;
gap:12px;
}

.msg{
padding:14px;
border-radius:14px;
max-width:85%;
white-space:pre-wrap;
}

.user{
align-self:flex-end;
background:#2563eb;
}

.bot{
align-self:flex-start;
background:var(--card);
}

.chatbox{
padding:16px;
border-top:1px solid var(--border);
}

.row{
display:flex;
gap:10px;
}

textarea{
flex:1;
min-height:60px;
padding:14px;
background:#08111d;
border:none;
border-radius:14px;
color:white;
resize:none;
}

.send{
width:120px;
}

@media(max-width:900px){

.container{
grid-template-columns:1fr;
}

.left{
display:none;
}

}

</style>
</head>

<body>

<div class="container">

<div class="left">

<div class="logo">
📄 PDF Chat
</div>

<div class="card">

<h3>Upload PDF</h3>

<input
type="file"
id="file"
accept=".pdf"
/>

<button onclick="uploadFile()">
Upload
</button>

</div>

<div id="status">
Upload PDF to begin.
</div>

</div>

<div class="right">

<div class="header">
Research Assistant
</div>

<div id="chat" class="chat">

<div class="msg bot">
Upload a PDF to start chatting.
</div>

</div>

<div class="chatbox">

<div class="row">

<textarea
id="q"
disabled
></textarea>

<button
onclick="ask()"
class="send">
Send
</button>

</div>

</div>

</div>

</div>

<script>

const chat=document.getElementById("chat");
const input=document.getElementById("q");
const status=document.getElementById("status");

function add(text,type){

let d=document.createElement("div");

d.className="msg "+type;

d.innerText=text;

chat.appendChild(d);

chat.scrollTop=chat.scrollHeight;

return d;
}

function enable(){
input.disabled=false;
}

async function uploadFile(){

let f=document.getElementById("file").files[0];

if(!f){
alert("Select PDF");
return;
}

status.innerText="Processing PDF...";

let fd=new FormData();

fd.append("file",f);

let r=await fetch("/upload",{
method:"POST",
body:fd
});

let d=await r.json();

if(d.error){

status.innerText=d.error;
return;
}

status.innerText=
`Chunks: ${d.chunks}
Embedding Time: ${d.embed_time}s`;

enable();
}

async function ask(){

let q=input.value;

if(!q)return;

add(q,"user");

input.value="";

let bot=add("Thinking...","bot");

let r=await fetch("/ask",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({
question:q
})

});

let d=await r.json();

bot.innerText=d.answer;
}

</script>

</body>
</html>
```
